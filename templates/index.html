<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Resume Analyzer</title>

</head>

<body>

    <h1>Smart Resume Analyzer</h1>

    <p>
        Upload your resume PDF and extract its text for analysis.
    </p>


    <!-- Resume Upload Form -->

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >

        <button type="submit">
            Analyze Resume
        </button>

    </form>


    <!-- Display Original Extracted Text -->

    {% if extracted_text %}

        <h2>Extracted Resume Text</h2>

        <pre>{{ extracted_text }}</pre>

    {% endif %}


    <!-- Display Cleaned Text -->

    {% if cleaned_text %}

        <h2>Cleaned Resume Text</h2>

        <pre>{{ cleaned_text }}</pre>

    {% endif %}


</body>

</html>
